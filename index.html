<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <title>Web-shop-kirilldevx</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="img_btn">
                <button class="left"><img src="img/move-left.svg" alt=""></button>
                <button class="like"><img src="img/heart.svg" alt=""></button>
                <img class="straw" src="img/Y1UiAGru1ighUoFlFKmE_zdXBM0RT1C3_cWkE99_IZWhVoMd52bvPX5PevD1N_L2rjxIlWSZ1gVPEX_FtmR5KLI8xaoCojeJbbr7Ttct1uu7rGa3dSoblgFEzRWDc8z_YtsthT_E-keMpJi7CrN5welqgGUD5gNQc7-minUaR5WbZR2w59WE-GS_UsYjrg9-.jpe" alt="Fresh strawberrries">
            </div>
            <div class="container_text">
                <div class="header">
                    <span class="class">Fruits</span>
                    <span class="sale">20% off</span> 
                </div>
                <h2 class="name">Organic Strawberries</h2>
                <span class="author">Author:<a href="https://github.com/KirilldevX">KirillDevX</a></span>
                <div class="rate">
                    <div class="stars">
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star"></i>
                        <i class="fa fa-star-half-o" aria-hidden="true"></i>
                    </div>
                    <p class="rate_num">4.8</p>
                    <p>(89 reviews)</p>
                </div>
                <div class="price">
                    <p class="now">$<span class="now_cost">6.20</span></p>
                    <s class="past">$7.20</s>
                    <span class="hm">per kg</span>
                </div>
                <p class="descr">Grown without pesky synthetic pesticides and fertilizers. These fresh strawberries are packed with natural nutrients and a delicious taste.</p>
                <div class="icons">
                    <div class="del">
                        <i class="fa fa-truck" aria-hidden="true"></i>
                        <span>Free delivery</span>
                    </div>
                    <div class="org">
                        <i class="fa fa-leaf" aria-hidden="true"></i>
                        <span>Organic</span>
                    </div>
                    <div class="fr">
                        <i class="fa fa-tint"></i>
                        <span>Fresh</span>
                    </div>
                    <div class="pim">
                        <i class="fa fa-globe" aria-hidden="true"></i>
                        <span>Producted in Mexico</span>
                    </div>
                </div>
            </div>
            <div class="buy">
                <div class="num">
                    <button class="min"><i class="fa fa-minus" aria-hidden="true"></i></button>
                    <span class="amount">1</span>
                    <span>kg</span>
                    <button class="plus"><i class="fa fa-plus" aria-hidden="true"></i></button>
                </div>
                <div class="add_cart">
                    <button class="add_to_cart">
                        <span>Add to cart</span>
                        <p class="cart">
                        $<span class="cart_cost">6.20</span>
                        </p>
                    </button>
                </div>
            </div>
        </div>
    </main>
    <script src="js/buttons.js"></script>
</body>
</html>
